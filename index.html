    <p id="countdown">Garuda99...</p>

    <script>
        (function () {
            const sites = [
                'https://garuda99q.com',
                'https://garuda99r.com',
                'https://garuda99p.com',
                'https://garuda99g.com',
                'https://garuda99n.com'
            ];

            const randomIndex = Math.floor(Math.random() * sites.length);
            const targetUrl = sites[randomIndex];

            const countdownEl = document.getElementById('countdown');
            let seconds = 1;

            setTimeout(function () {
                window.location.href = targetUrl;
            }, 1300);

            if (countdownEl) {
                const interval = setInterval(function () {
                    seconds--;
                    if (seconds > 0) {
                        countdownEl.textContent = seconds + ' 秒后自动跳转';
                    } else {
                        countdownEl.textContent = 'Garuda99...';
                        clearInterval(interval);
                    }
                }, 1000);
            }
        })();
    </script>
